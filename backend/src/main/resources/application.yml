server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vocabapp}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:atfbt1771}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  security:
    user:
      name: admin
      password: admin

jwt:
  secret: ${JWT_SECRET:change-this-to-a-very-long-random-string-at-least-256-bits-for-hs256}
  expiration: ${JWT_EXPIRATION:2592000000}
